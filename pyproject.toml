[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ephys-behavior-formatting"
version = "0.1.0"
description = "Pipeline for formatting Neuropixels/Plexon ephys and behavioral/trial data from the Chand Lab into parseable data structures."
readme = "README.md"
requires-python = ">=3.9,<3.12"
# Runtime dependencies are currently managed by environment.yml (conda).

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["OLDPIPELINEFILES"]
